id: "diabetes-annual-check"
title: "Diabète de type 2 : bilan initial et annuel des complications"
guideline: "ADA Standards of Care in Diabetes 2026"
reviewed_by: null
note: "Bilan complet annuel recommandé pour tous les patients diabétiques de type 2."
urgent_message:
  fr: "Consultez un médecin en urgence ou appelez le SAMU (190)."
  en: "Seek urgent care or call emergency services (190)."
urgent_questions:
  - id: "uq1"
    fr: "Vomissements, douleurs abdominales, respiration rapide et profonde ou haleine fruitée ?"
    en: "Vomiting, abdominal pain, deep rapid breathing or fruity breath?"
  - id: "uq2"
    fr: "Confusion, somnolence importante ou perte de connaissance ?"
    en: "Confusion, extreme drowsiness or loss of consciousness?"
  - id: "uq3"
    fr: "Soif intense, urines très fréquentes et grande faiblesse ?"
    en: "Intense thirst, very frequent urination and extreme weakness?"
  - id: "uq4"
    fr: "Douleur thoracique, faiblesse d'un côté du corps ou difficulté à parler ?"
    en: "Chest pain, one-sided weakness or difficulty speaking?"
  - id: "uq5"
    fr: "Pied rouge, chaud, gonflé, ou plaie qui suppure, avec ou sans fièvre ?"
    en: "Red, warm, swollen foot, or oozing wound, with or without fever?"
  - id: "uq6"
    fr: "Perte soudaine de la vue ?"
    en: "Sudden loss of vision?"
tests:
  - code: "HBA1C"
    synonyms: ["HbA1c", "hémoglobine glyquée", "hemoglobine glyquee", "A1C"]
    unit: "%"
    conv:
      "mmol/mol":
        scale: 0.0915
        offset: 2.15
    validity_days: 90
    specialty: "Laboratoire d'analyses médicales"
  - code: "LIPID_PANEL"
    synonyms: ["bilan lipidique", "cholestérol total", "HDL", "LDL", "triglycérides", "lipidogramme"]
    components: ["TOTAL_CHOL", "HDL", "TG"]
    validity_days: 365
    specialty: "Laboratoire d'analyses médicales"
  - code: "CREATININE"
    synonyms: ["créatinine", "creatinine", "créatininémie", "creatininemie"]
    unit: "mg/dL"
    conv:
      "µmol/L": 0.0113
      "umol/L": 0.0113
    validity_days: 365
    specialty: "Laboratoire d'analyses médicales"
  - code: "EGFR"
    synonyms: ["DFG", "débit de filtration glomérulaire", "debit de filtration glomerulaire", "eGFR"]
    unit: "mL/min/1.73m2"
    validity_days: 365
    flag: "<60"
    specialty: "Laboratoire d'analyses médicales"
  - code: "URINE_ACR"
    synonyms: ["microalbuminurie", "albuminurie", "rapport albumine/créatinine", "rapport albumine/creatinine", "UACR"]
    unit: "mg/g"
    conv:
      "mg/mmol": 8.84
    validity_days: 365
    flag: ">=30"
    specialty: "Laboratoire d'analyses médicales"
  - code: "EYE_EXAM"
    synonyms: ["fond d'œil", "fond d'oeil", "examen ophtalmologique", "rétinographie", "retinographie"]
    type: "report"
    specialty: "Ophtalmologie"
    validity_days: 365
  - code: "FOOT_EXAM"
    synonyms: ["examen des pieds", "monofilament", "examen podologique"]
    type: "report"
    specialty: "Podologie / Médecine générale"
    validity_days: 365
